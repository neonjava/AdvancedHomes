<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="Workflow for AdvancedHomes: Player saves a home, Homes are stored, Player opens home menu, Teleport to selected home">
<title>AdvancedHomes workflow</title><desc>Player saves a home → Homes are stored → Player opens home menu → Teleport to selected home</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091322"/><stop offset="1" stop-color="#111a2c"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#6ee7a8" stop-opacity=".22"/><stop offset="1" stop-color="#6ee7a8" stop-opacity="0"/></radialGradient>
</defs>
<style>
text { font-family: Inter, Arial, sans-serif; }
.flow { animation: move 1.2s linear infinite; }
.beacon { animation: pulse 2.2s ease-in-out infinite; }
@keyframes move { to { stroke-dashoffset: -20; } }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .flow,.beacon { animation: none; } }
</style>
<rect width="1200" height="410" rx="24" fill="url(#bg)"/>
<circle cx="1100" cy="0" r="270" fill="url(#glow)"/>
<circle cx="0" cy="410" r="180" fill="url(#glow)" opacity=".4"/>
<text x="34" y="42" fill="#6ee7a8" font-size="12" font-weight="700" letter-spacing="3">HOW IT WORKS</text>
<text x="34" y="83" fill="#f3f6fb" font-size="31" font-weight="700">AdvancedHomes</text>
<rect x="925" y="38" width="240" height="36" rx="18" fill="#19273b" stroke="#33455d"/>
<circle class="beacon" cx="946" cy="56" r="5" fill="#6ee7a8"/>
<text x="963" y="61" fill="#c9d7e7" font-size="14">Minecraft plugin</text>
