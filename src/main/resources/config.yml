# Advanced Homes Plugin Configuration

# Maximum number of home slots displayed in the UI (up to 90)
max-homes: 90

# Delay in seconds before a player is teleported to a home (0 for instant)
teleport-delay: 3

# If true, any movement will cancel the teleportation countdown
cancel-on-move: true

# Allow colored names using standard Bukkit color codes (e.g., &a, &b)
allow-colored-names: true

# Prefer the classic chest Inventory GUI over the new Dialogue API (allows showing actual block textures)
prefer-inventory-ui: false

# Icon material for the Team Home button in the chest inventory GUI
team-home-icon: EMERALD_BLOCK

# Enable Bedrock Edition player support (via Geyser/Floodgate detection fallback to Inventory GUI)
enable-bedrock-support: true

# Storage type: 'sqlite' or 'mysql'
storage-type: sqlite

# MySQL Settings (Only used if storage-type is set to 'mysql')
mysql:
  host: localhost
  port: 3306
  database: minecraft
  username: root
  password: ""

# Custom messages configuration
messages:
  need-rank: "&cYou need <rank> rank to access this home slot!"
  buy-rank: "&ePurchase rank upgrades at &b&nneonjava.in&e store section!"
  locked-tooltip: "&fVisit &b&nneonjava.in&f for even more home slots"
  locked-warning: "&cThis home slot is locked by your rank. Visit &b&nneonjava.in&c to upgrade!"
  buy-ranks-warning: "&eRanks can be purchased at &b&nneonjava.in&e in the store section."
  home-expired: "&cThis home has expired! You cannot teleport to it anymore."
  need-rank-teleport: "&cYou need a higher rank to access this home! Visit &b&nneonjava.in&c to unlock."
